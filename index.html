        '<label class="switch" for="coachSw"><input type="checkbox" id="coachSw"' + (l.coach ? ' checked' : '') + '><span>' + t('lobby.coachSwitch') + '</span></label>' +
        button('custom', t('lobby.customBtn'), 'wide') + '</div>' +
      '</div>';
  },
};

const formatClock = ms => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const formatDelta = d => (d > 0 ? '+' : d < 0 ? '−' : '±') + Math.abs(d);
/* centipawns → "+1.4", mates → "+M3" */
function formatEval(cp) {
  if (Math.abs(cp) > 9000) return (cp > 0 ? '+' : '−') + 'M' + Math.round((10000 - Math.abs(cp)) / 10);
  return (cp > 0 ? '+' : cp < 0 ? '−' : '') + localDecimal((Math.abs(cp) / 100).toFixed(1));
}

/* clocks */
setInterval(() => {
  const g = Game.current;
  if (!g || g.over || g.running < 0) return;
  Game.tick(g);
  if (g.clock[g.running] <= 0) return Game.finish(g, { winner: g.running ^ 1, reason: 'time' });
  Game.paintClocks();
}, 200);

/* src/ui/trainer.js */
/* Shared logic of the exercises where the player must find the moves of a known line:
 * opening drills (openings.js) and tactics puzzles (tactics.js).
 *
 * A trainer holds a position and a line (SAN moves, player and opponent alternating).
 * The player's moves are checked against the line; the opponent's replies are played
 * automatically. The screen object owning the trainer provides:
 *   isActive(tr)         false once the trainer was replaced or closed
 *   accepts(tr, san, expected, isLast)
 *   messages             { good, wrong } i18n keys, with {san}
 *   finished(tr)         record the result
 *   paint()
 */
const REPLY_DELAY = 500;

const Trainer = {
  create(screen, fen, line, me) {
    return Object.assign(newSelection(), {
      screen, line, me,
      pos: Chess.create(fen),
      idx: 0,                 // next move of the line to play
      errors: 0, errorsHere: 0,
      helped: false,          // used the hint, the arrow or looked at the line
      done: false, clean: false, busy: false,
      hint: -1, arrow: null, last: null,
      msg: null,              // { ok, text } feedback on the last move
    });
  },

  expected(tr) { return tr.pos.fromSan(tr.line[tr.idx]); },
  playersTurn(tr) { return !tr.done && !tr.busy && tr.pos.turn() === tr.me; },

  square(tr, sq) {
    if (!tr || !this.playersTurn(tr)) return;
    const moves = pickMove(tr, tr.pos, sq, tr.me);
    if (moves) this.tryMove(tr, autoQueen(moves));
    else tr.screen.paint();
  },

  tryMove(tr, m) {
    const s = tr.screen, expected = tr.line[tr.idx], san = tr.pos.san(m), isLast = tr.idx === tr.line.length - 1;
    clearSelection(tr);
    if (!s.accepts(tr, san, expected, isLast)) {
      Sound.play('wrong');
      tr.errors++;
      tr.errorsHere++;
      tr.msg = { ok: false, text: t(s.messages.wrong, { san: localSan(san) }) };
      /* second miss on the same move: outline the piece to move */
      if (tr.errorsHere >= 2) tr.hint = Move.from(this.expected(tr));
      return s.paint();
    }
    this.advance(tr, m);
    Object.assign(tr, { errorsHere: 0, hint: -1, arrow: null, msg: { ok: true, text: t(s.messages.good, { san: localSan(san) }) } });
    if (tr.idx >= tr.line.length) return this.finish(tr);
    this.reply(tr);
  },

  advance(tr, m) {
    playMove(tr.pos, m);
    tr.last = [Move.from(m), Move.to(m)];
    tr.idx++;
  },

  /* the opponent's move of the line, after a short pause */
  reply(tr) {
    if (tr.idx >= tr.line.length) return this.finish(tr);
    tr.busy = true;
    tr.screen.paint();
    setTimeout(() => {
      if (!tr.screen.isActive(tr)) return;
      this.advance(tr, this.expected(tr));
      tr.busy = false;
      if (tr.idx >= tr.line.length) this.finish(tr);
      else tr.screen.paint();
    }, REPLY_DELAY);
  },

  finish(tr) {
    tr.done = true;
    tr.busy = false;
    tr.clean = !tr.errors && !tr.helped;
    tr.screen.finished(tr);
    tr.screen.paint();
    const mated = tr.pos.inCheck() && !tr.pos.legal().length; // let the mate sound play first
    setTimeout(() => Sound.play(tr.clean ? 'win' : 'draw'), mated ? 650 : 250);
  },

  hint(tr) {
    if (!this.playersTurn(tr)) return;
    tr.hint = Move.from(this.expected(tr));
    tr.helped = true;
    tr.screen.paint();
  },
  showMove(tr) {
    if (!this.playersTurn(tr)) return false;
    const m = this.expected(tr);
    tr.arrow = [Move.from(m), Move.to(m)];
    tr.helped = true;
    return true;
  },

  /* keep playing the position against the engine, with the coach */
  continueAgainstEngine(tr, opening) {
    Game.start({ mode: 'casual', kind: 'coached', coach: true, colour: tr.me, botElo: Store.profile.elo, fen: tr.pos.fen(), opening });
  },

  /* ---- screen parts ---- */
  html(withBar) {
    return '<section class="game"><div class="left"><div class="pbar"><span class="who" id="trWho"></span><span class="chip" id="trProgress"></span></div>' +
      '<div class="bwrap"><div class="board" id="board"></div></div>' + (withBar ? '<div class="bar" id="trBar"></div>' : '') + '</div>' +
      '<div class="side"><div id="trCard"></div><div class="row" id="trActions"></div><div id="trLearn"></div></div></section>';
  },

  /* returns false when the screen skeleton is missing (the caller re-renders) */
  paint(tr, who, progress) {
    if (!$('#trCard')) return false;
    $('#trWho').innerHTML = '<i class="' + (tr.me ? 'b' : 'w') + '"></i>' + esc(who);
    $('#trProgress').textContent = progress;
    drawBoard($('#board'), { pos: tr.pos, flip: tr.me === 1, last: tr.last, sel: tr.sel, targets: tr.targets, hint: tr.hint, arrow: tr.arrow });
    return true;
  },

  feedback(tr, idle) {
    return tr.msg ? verdict(tr.msg.ok, tr.msg.text) : '<p class="muted">' + idle + '</p>';
  },

  /* the explanation panel is only rebuilt when its content changes, so an opened panel stays open */
  paintLearn(key, html) {
    const el = $('#trLearn');
    if (el.dataset.key !== key) { el.innerHTML = html; el.dataset.key = key; }
  },
};

/* src/ui/openings.js */
/* Openings tab: opening of the day, the list, and the drill where the player replays a line. */
const Openings = {
  drill: null,

  daily() { return OPENINGS[dayIndex() % OPENINGS.length]; },
  movesCount(o) { return Math.ceil(o.line.length / 2); },

  /* ---- drill (a Trainer, see trainer.js) ---- */
  messages: { good: 'drill.good', wrong: 'drill.wrong' },
  isActive(tr) { return this.drill === tr; },
  accepts(tr, san, expected) { return stripCheck(san) === stripCheck(expected); },
  finished(tr) { Store.recordExercise('openings', tr.op.id, tr.clean); },

  start(id) {
    const op = openingById(id);
    if (!op) return;
    const me = op.side === 'w' ? 0 : 1;
    this.drill = Object.assign(Trainer.create(this, Chess.START, op.line, me), { op, showLine: false });
    App.render();
    if (me === 1) Trainer.reply(this.drill);
  },
  quit() { this.drill = null; App.render(); },
  square(sq) { Trainer.square(this.drill, sq); },
  toggleLine() {
    const d = this.drill;
    d.showLine = !d.showLine;
    if (d.showLine) d.helped = true;
    this.paint();
  },

  /* ---- screens ---- */
  html() { return this.drill ? Trainer.html(true) : this.listHtml(); },

  listHtml() {
    const d = this.daily();
    const row = o => '<li><button class="op" data-act="drill" data-id="' + o.id + '" style="--c:' + sideColour(o.side) + '">' +
      '<span class="grow"><span class="o-name">' + esc(openingName(o)) + '</span><br>' +
      '<span class="o-sub">' + o.eco + ' · ' + t('openings.moves', { n: this.movesCount(o) }) + ' · ' + t('tag.' + o.style[0]) + '</span></span>' +
      statusChip(Store.exercise('openings', o.id), 'openings.ok', 'openings') + '</button></li>';
    const column = (side, label) => '<div class="stack"><span class="label">' + t(label) + '</span><ul class="ops">' +
      OPENINGS.filter(o => o.side === side).map(row).join('') + '</ul></div>';
    return '<div class="card glow"><span class="label">' + t('openings.daily') + ' · ' + d.eco + '</span>' +
        '<h2>' + esc(openingName(d)) + '</h2><p>' + esc(openingIdea(d)) + '</p>' +
        '<p class="muted small">' + t('openings.youPlay', { side: sideName(d.side === 'b'), n: this.movesCount(d) }) + '</p>' +
        button('drill', t('openings.train'), 'primary wide', ' data-id="' + d.id + '"') + '</div>' +
      learnHtml('openings', d.id, true) +
      '<div class="row between"><h2>' + t('openings.all') + '</h2><span class="chip acc">' +
        t('openings.doneCount', { a: Store.solvedCount('openings', OPENINGS), b: OPENINGS.length }) + '</span></div>' +
      '<div class="cols">' + column('w', 'openings.withWhite') + column('b', 'openings.withBlack') + '</div>';
  },

  paint() {
    const d = this.drill;
    if (!d || App.view() !== 'openings') return;
    const op = d.op, n = op.line.length;
    const mine = upTo => op.line.slice(0, upTo).filter((_, i) => i % 2 === d.me).length;
    if (!Trainer.paint(d, openingName(op), mine(d.idx) + ' / ' + mine(n))) return App.render();
    $('#trBar').innerHTML = op.line.map((_, i) => '<i class="' + (i < d.idx ? 'on' : i === d.idx && !d.done ? 'cur' : '') + '"></i>').join('');

    if (d.done) {
      const result = d.clean ? t('drill.clean') : t('drill.errors', { n: d.errors }) + (d.helped ? t('drill.withHelp') : '') + t('drill.replay');
      $('#trCard').innerHTML = '<div class="card glow"><span class="label">' + op.eco + ' · ' + t('drill.finished') + '</span>' +
        '<h2>' + esc(openingName(op)) + '</h2>' + verdict(d.clean, result) +
        '<p>' + esc(openingIdea(op)) + '</p><p class="line">' + lineText(op.line, n) + '</p></div>';
      $('#trActions').innerHTML = button('drill-again', t('drill.again'), 'primary') + button('drill-play', t('drill.continue')) + button('drill-quit', t('drill.others'));
    } else {
      const line = d.showLine ? lineText(op.line, n) : lineText(op.line, d.idx) + (d.idx < n ? ' <span class="muted">…</span>' : '');
      $('#trCard').innerHTML = '<div class="card"><span class="label">' + op.eco + ' · ' + t('drill.youPlay', { side: sideName(d.me) }) + '</span>' +
        '<p>' + esc(openingIdea(op)) + '</p>' + Trainer.feedback(d, t('drill.prompt')) + '<p class="line">' + line + '</p></div>';
      $('#trActions').innerHTML = button('drill-hint', t('drill.hint'), 'sm') + button('drill-show', t('drill.show'), 'sm') +
        button('drill-line', t(d.showLine ? 'drill.hideLine' : 'drill.showLine'), 'sm') +
        button('drill-again', t('drill.restart'), 'sm') + button('drill-quit', t('drill.quit'), 'sm');
    }
    Trainer.paintLearn(LANG + op.id, learnHtml('openings', op.id, true));
  },
};

const stripCheck = san => san.replace(/[+#]/g, '');
const sideColour = side => side === 'w' ? '#f2f8e6' : '#54745c';
/* "1. e4 e5 2. Nf3" for the first `upTo` moves, in the local notation */
function lineText(line, upTo) {
  return line.slice(0, upTo).map((san, i) => (i % 2 === 0 ? (i / 2 + 1) + '. ' : '') + esc(localSan(san))).join(' ');
}

/* src/ui/tactics.js */
/* Tactics tab: puzzle of the day, puzzles grouped by theme, and the puzzle screen.
 * The theme stays hidden until the player asks for it or solves the puzzle,
 * so that recognising the pattern is part of the exercise. */
const Tactics = {
  puzzle: null,

  daily() { return TACTICS[(dayIndex() + 7) % TACTICS.length]; },
  number(x) { return TACTICS.indexOf(x) + 1; },
  playerColour(x) { return x.fen.split(' ')[1] === 'b' ? 1 : 0; },
  /* "White to play and mate in 2." */
  goal(x) {
    const side = this.playerColour(x) ? 'B' : 'W';
    return x.line[x.line.length - 1].includes('#') ? t('tactics.mate' + side, { n: Math.ceil(x.line.length / 2) }) : t('tactics.win' + side);
  },

  /* ---- puzzle (a Trainer, see trainer.js) ---- */
  messages: { good: 'tactics.good', wrong: 'tactics.wrong' },
  isActive(tr) { return this.puzzle === tr; },
  /* the last move may also be another listed move, or any other mate when the line ends in mate */
  accepts(tr, san, expected, isLast) {
    if (stripCheck(san) === stripCheck(expected)) return true;
    return isLast && (tr.x.alt.includes(san) || (expected.includes('#') && san.includes('#')));
  },
  finished(tr) {
    tr.showTheme = true;
    Store.recordExercise('tactics', tr.x.id, tr.clean);
  },

  start(id) {
    const x = TACTICS.find(q => q.id === id);
    if (!x) return;
    this.puzzle = Object.assign(Trainer.create(this, x.fen, x.line, this.playerColour(x)), { x, showTheme: false });
    App.render();
    Sound.play('start');
  },
  quit() { this.puzzle = null; App.render(); },
  square(sq) { Trainer.square(this.puzzle, sq); },
  /* the next unsolved puzzle after this one, or simply the next one */
  next() {
    const i = TACTICS.indexOf(this.puzzle.x);
    const after = TACTICS.slice(i + 1).concat(TACTICS.slice(0, i + 1));
    this.start((after.find(q => !Store.exercise('tactics', q.id).ok) || after[0]).id);
  },
  revealTheme() { this.puzzle.showTheme = true; this.paint(); },
  showMove() {
    if (Trainer.showMove(this.puzzle)) { this.puzzle.showTheme = true; this.paint(); }
  },

  /* ---- screens ---- */
  html() { return this.puzzle ? Trainer.html(false) : this.listHtml(); },

  listHtml() {
    const d = this.daily();
    const row = x => '<li><button class="op" data-act="puzzle" data-id="' + x.id + '" style="--c:' + sideColour(this.playerColour(x) ? 'b' : 'w') + '">' +
      '<span class="grow"><span class="o-name">' + t('tactics.puzzle', { n: this.number(x) }) + '</span><br><span class="o-sub">' + esc(this.goal(x)) + '</span></span>' +
      statusChip(Store.exercise('tactics', x.id), 'tactics.ok', 'tactics') + '</button></li>';
    const cards = Object.keys(THEMES).map(th => {
      const puzzles = TACTICS.filter(x => x.theme === th);
      if (!puzzles.length) return '';
      return '<div class="card theme"><div class="row between"><h3>' + t('theme.' + th) + '</h3>' + keyPiecesHtml(THEMES[th].keyPieces, false) + '</div>' +
        '<p class="small">' + esc(learnText('themes', th)[0]) + '</p>' +
        '<ul class="ops">' + puzzles.map(row).join('') + '</ul>' + learnHtml('themes', th, false) + '</div>';
    }).filter(Boolean);
    /* two columns, filled alternately */
    const column = parity => '<div class="stack">' + cards.filter((_, i) => i % 2 === parity).join('') + '</div>';
    return '<div class="card glow"><span class="label">' + t('tactics.daily') + ' · ' + t('tactics.puzzle', { n: this.number(d) }) + '</span>' +
        '<h2>' + esc(this.goal(d)) + '</h2><p class="muted">' + t('tactics.intro') + '</p>' +
        button('puzzle', t('tactics.solve'), 'primary wide', ' data-id="' + d.id + '"') + '</div>' +
      '<div class="row between"><h2>' + t('tactics.themes') + '</h2><span class="chip acc">' +
        t('tactics.count', { a: Store.solvedCount('tactics', TACTICS), b: TACTICS.length }) + '</span></div>' +
      '<div class="cols">' + column(0) + column(1) + '</div>';
  },

  paint() {
    const z = this.puzzle;
    if (!z || App.view() !== 'tactics') return;
    const x = z.x, total = Math.ceil(x.line.length / 2);
    if (!Trainer.paint(z, t('tactics.puzzle', { n: this.number(x) }), Math.min(Math.ceil(z.idx / 2), total) + ' / ' + total)) return App.render();
    const theme = t('theme.' + x.theme);

    if (z.done) {
      const result = z.clean ? t('tactics.clean') : z.errors ? t('tactics.errors', { n: z.errors }) : t('tactics.helped');
      $('#trCard').innerHTML = '<div class="card glow"><span class="label">' + t('tactics.solved') + ' · ' + theme + '</span>' +
        '<h2>' + esc(this.goal(x)) + '</h2>' + verdict(z.clean, result) + '<p class="line">' + x.line.map(s => esc(localSan(s))).join(' ') + '</p></div>';
      const gameOver = !z.pos.legal().length;
      $('#trActions').innerHTML = button('puzzle-next', t('tactics.next'), 'primary') + button('puzzle-again', t('drill.again')) +
        (gameOver ? '' : button('puzzle-play', t('drill.continue'))) + button('puzzle-quit', t('tactics.list'));
    } else {
      $('#trCard').innerHTML = '<div class="card"><span class="label">' + (z.showTheme ? t('tactics.theme', { th: theme }) : t('tactics.hidden')) + '</span>' +
        '<h2>' + esc(this.goal(x)) + '</h2>' + Trainer.feedback(z, t('tactics.intro')) + '</div>';
      $('#trActions').innerHTML = (z.showTheme ? '' : button('puzzle-theme', t('tactics.reveal'), 'sm')) +
        button('puzzle-hint', t('drill.hint'), 'sm') + button('puzzle-show', t('drill.show'), 'sm') +
        button('puzzle-again', t('drill.restart'), 'sm') + button('puzzle-quit', t('drill.quit'), 'sm');
    }
    Trainer.paintLearn(LANG + x.id + z.showTheme, z.showTheme ? learnHtml('themes', x.theme, true) : '');
  },
};

/* src/ui/profile.js */
/* Profile tab: Elo chart, totals, recent games, reset. */
const Profile = {
  resetArmedAt: 0,

  eloChart(ranked) {
    if (!ranked.length) return '<p class="muted small">' + t('profile.graphEmpty') + '</p>';
    const pts = [DEFAULT_PROFILE.elo].concat(ranked.map(x => x.elo));
    const lo = Math.min(...pts) - 40, hi = Math.max(...pts) + 40, W = 320, H = 120;
    const X = i => 8 + i * (W - 16) / Math.max(1, pts.length - 1), Y = v => H - 10 - (v - lo) * (H - 24) / (hi - lo);
    let path = 'M' + X(0) + ' ' + Y(pts[0]);
    for (let i = 1; i < pts.length; i++) path += ' H' + X(i) + ' V' + Y(pts[i]); // pixel-style steps
    const last = pts.length - 1, label = (y, v) => '<text x="6" y="' + y + '" fill="#a9bfae" font-size="10" font-family="Pixelify Sans,monospace">' + v + '</text>';
    return '<svg class="graph" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t('profile.graphAria', { a: pts[0], b: pts[last] })) + '">' +
      '<path d="' + path + '" fill="none" stroke="#58c46f" stroke-width="2" shape-rendering="crispEdges"/>' +
      '<rect x="' + (X(last) - 3) + '" y="' + (Y(pts[last]) - 3) + '" width="6" height="6" fill="#c4f5a6"/>' +
      label(12, Math.max(...pts)) + label(H - 3, Math.min(...pts)) + '</svg>';
  },

  html() {
    const p = Store.profile, ranked = p.history.filter(x => x.mode === 'ranked');
    const games = p.history.slice(-12).reverse().map(x =>
      '<li><span class="r ' + x.result + '">' + t(RESULT_KEYS[x.result]) + '</span>' +
      '<span class="grow">' + esc(t('profile.row', { color: sideName(x.colour), opp: x.opponent, n: x.moves, reason: t('reason.' + x.reason) })) +
      (x.accuracy !== null && x.accuracy !== undefined ? ' · ' + x.accuracy + ' %' : '') + '</span>' +
      '<span class="chip">' + (x.mode === 'ranked' ? formatDelta(x.delta) : t('game.casual')) + '</span></li>').join('');
    const stat = (label, value, total) => '<div class="card"><span class="label">' + t(label) + '</span><span class="stat-num">' + value +
      (total ? '<small class="muted"> / ' + total + '</small>' : '') + '</span></div>';
    const engineNote = Engine.kind === 'stockfish' ? t('engine.noteSf', { name: esc(Engine.name) }) : t('engine.noteMini');

    return '<div class="cols"><div class="stack">' +
        '<div class="card glow"><span class="label">' + t('profile.elo') + '</span><div class="elo">' + p.elo + '</div>' + this.eloChart(ranked) + '</div>' +
        '<div class="stats">' + stat('profile.games', p.games) + stat('profile.best', p.best) +
          stat('profile.openings', Store.solvedCount('openings', OPENINGS), OPENINGS.length) +
          stat('profile.tactics', Store.solvedCount('tactics', TACTICS), TACTICS.length) + '</div>' +
        '<p class="muted small">' + t('profile.wdl', p.record) + '</p></div>' +
      '<div class="stack"><div class="card"><span class="label">' + t('profile.last') + '</span>' +
        (games ? '<ul class="hist">' + games + '</ul>' : '<p class="muted">' + t('profile.none') + '</p>') + '</div>' +
        '<p class="muted small">' + t(Store.synced ? 'profile.synced' : 'profile.local') + ' ' + engineNote + '</p>' +
        '<div class="row">' + button('reset', t(isArmed(this.resetArmedAt) ? 'profile.resetConfirm' : 'profile.reset'), 'sm ko') + '</div>' +
      '</div></div>';
  },

  reset() {
    if (isArmed(this.resetArmedAt)) {
      this.resetArmedAt = 0;
      Store.reset();
      toast(t('profile.resetDone'));
      return App.render();
    }
    this.resetArmedAt = Date.now();
    App.render();
    setTimeout(() => { if (App.view() === 'profile') App.render(); }, ARM_MS + 100);
  },
};

/* src/ui/app.js */
/* The shell: tabs (from the URL hash), header controls, and every click of the page.
 * Buttons say what they do with data-act="<action>" (plus data-* arguments); App.actions maps
 * each action to its handler, so the markup never holds inline JavaScript.
 */
const SCREENS = { play: Game, openings: Openings, tactics: Tactics, profile: Profile };

const App = {
  view() {
    const name = location.hash.slice(1);
    return SCREENS[name] ? name : 'play';
  },
  go(name) { if (this.view() !== name) location.hash = name; },

  render() {
    const name = this.view(), screen = SCREENS[name];
    document.querySelectorAll('.nav button').forEach(b => {
      if (b.dataset.view === name) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    $('#view').innerHTML = screen.html();
    if (screen.paint) screen.paint();
    this.paintEngine();
    this.paintSound();
  },

  /* re-render unless the player is in the middle of a game or an exercise (used after a sync) */
  refreshIfIdle() {
    this.applyLang();
    if (!Game.current && !Openings.drill && !Tactics.puzzle) this.render();
    else if (this.view() === 'profile') this.render();
  },

  applyLang() {
    setLang(Store.profile.lang);
    const select = $('#langSel');
    if (!select.options.length) select.innerHTML = Object.keys(I18N).map(code => '<option value="' + code + '">' + I18N[code].name + '</option>').join('');
    select.value = LANG;
    select.setAttribute('aria-label', t('language'));
    document.querySelectorAll('.nav button').forEach(b => { b.querySelector('span').textContent = t('nav.' + b.dataset.view); });
  },

  paintEngine() {
    const chip = $('#engChip');
    chip.textContent = Engine.name;
    chip.className = 'chip ' + (Engine.kind === 'stockfish' ? 'ok' : 'warn');
  },

  paintSound() {
    const b = $('#sndBtn'), on = !!Store.profile.sound;
    b.textContent = t(on ? 'sound.on' : 'sound.off');
    b.setAttribute('aria-pressed', String(on));
  },

  actions: {
    nav: el => App.go(el.dataset.view),
    square: el => SCREENS[App.view()].square(+el.dataset.sq),
    sound() {
      const p = Store.profile;
      p.sound = !p.sound;
      Store.save();
      App.paintSound();
      if (p.sound) { Sound.wake(); Sound.play('move'); }
    },

    /* lobby and game */
    ranked: () => Game.start({ mode: 'ranked', kind: 'ranked', coach: false, colour: randInt(2), botElo: Store.profile.elo }),
    coached: () => Game.start({ mode: 'casual', kind: 'coached', coach: true, colour: randInt(2), botElo: Store.profile.elo }),
    custom() {
      const l = Game.lobby, colour = { white: 0, black: 1 }[l.colour];
      Game.start({ mode: 'casual', kind: 'custom', coach: l.coach, colour: colour === undefined ? randInt(2) : colour, botElo: l.level || Game.defaultLevel() });
    },
    colour(el) { Game.lobby.colour = el.dataset.colour; App.render(); },
    promote: el => Game.promote(+el.dataset.move),
    review: el => Game.review(+el.dataset.ply),
    live: () => Game.current && Game.review(Game.current.moves.length),
    undo: () => Game.undo(),
    resign: () => Game.resign(),
    again: () => Game.again(),
    lobby: () => Game.quit(),

    /* openings */
    drill(el) { Openings.start(el.dataset.id); scrollTo(0, 0); },
    'drill-again': withDrill(d => Openings.start(d.op.id)),
    'drill-quit': withDrill(() => Openings.quit()),
    'drill-line': withDrill(() => Openings.toggleLine()),
    'drill-hint': withDrill(d => Trainer.hint(d)),
    'drill-show': withDrill(d => { if (Trainer.showMove(d)) Openings.paint(); }),
    'drill-play': withDrill(d => Trainer.continueAgainstEngine(d, d.op.id)),

    /* tactics */
    puzzle(el) { Tactics.start(el.dataset.id); scrollTo(0, 0); },
    'puzzle-again': withPuzzle(z => Tactics.start(z.x.id)),
    'puzzle-next': withPuzzle(() => { Tactics.next(); scrollTo(0, 0); }),
    'puzzle-quit': withPuzzle(() => Tactics.quit()),
    'puzzle-theme': withPuzzle(() => Tactics.revealTheme()),
    'puzzle-hint': withPuzzle(z => Trainer.hint(z)),
    'puzzle-show': withPuzzle(() => Tactics.showMove()),
    'puzzle-play': withPuzzle(z => Trainer.continueAgainstEngine(z, null)),

    /* profile */
    reset: () => Profile.reset(),
  },
};

function withDrill(fn) { return () => { if (Openings.drill) fn(Openings.drill); }; }
function withPuzzle(fn) { return () => { if (Tactics.puzzle) fn(Tactics.puzzle); }; }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  const action = el && App.actions[el.dataset.act];
  if (action) action(el);
});
document.addEventListener('input', e => {
  if (e.target.id === 'lvl') { Game.lobby.level = +e.target.value; $('#lvlOut').textContent = Game.lobby.level; }
});
document.addEventListener('change', e => {
  if (e.target.id === 'coachSw') Game.lobby.coach = e.target.checked;
  if (e.target.id === 'langSel') { Store.profile.lang = e.target.value; Store.save(); App.applyLang(); App.render(); }
});
window.addEventListener('hashchange', () => { App.render(); scrollTo(0, 0); });

/* src/ui/backdrop.js */
/* Animated background: a dark cave with glowing mushrooms and drifting spores, drawn at a quarter
   of the screen resolution and scaled up for the pixel look. Static if the user prefers reduced motion. */
(function cave() {
  const canvas = $('#cave'), ctx = canvas.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w = 0, h = 0, spores = [], mushrooms = [];

  function resize() {
    w = canvas.width = Math.ceil(innerWidth / 4);
    h = canvas.height = Math.ceil(innerHeight / 4);
    spores = Array.from({ length: Math.round(w * h / 700) }, () => ({
      x: Math.random() * w, y: Math.random() * h, speed: 2 + Math.random() * 5, phase: Math.random() * 6.28, size: Math.random() < .15 ? 2 : 1,
    }));
    const count = Math.max(4, Math.round(w / 26));
    mushrooms = Array.from({ length: count }, (_, i) => ({ x: (i + .2 + Math.random() * .6) * w / count, size: 2 + randInt(3), phase: Math.random() * 6.28 }));
    draw(0);
  }

  function draw(time) {
    ctx.fillStyle = '#060b08';
    ctx.fillRect(0, 0, w, h);
    /* stalactites */
    ctx.fillStyle = '#0a120d';
    for (let i = 0; i < w; i += 7) {
      const a = 3 + (i * 37) % 11, b = 2 + (i * 13) % 5;
      ctx.fillRect(i, 0, 5, a);
      ctx.fillRect(i + 1, a, 3, b);
      ctx.fillRect(i + 2, a + b, 1, 2);
    }
    /* mushrooms with a pulsing glow */
    for (const m of mushrooms) {
      const y = h - 3, glow = .55 + .25 * Math.sin(time * .0012 + m.phase), r = m.size * 7, cy = y - m.size * 2, x = m.x | 0;
      const halo = ctx.createRadialGradient(m.x, cy, 0, m.x, cy, r);
      halo.addColorStop(0, 'rgba(98,224,127,' + (.22 * glow) + ')');
      halo.addColorStop(1, 'rgba(98,224,127,0)');
      ctx.fillStyle = halo;
      ctx.fillRect(m.x - r, cy - r, r * 2, r * 2);
      ctx.fillStyle = '#1d3324';
      ctx.fillRect(x, cy, 1, m.size * 2 + 3);
      ctx.fillStyle = 'rgba(196,245,166,' + (.55 + .4 * glow) + ')';
      ctx.fillRect(x - m.size, cy - 1, m.size * 2 + 1, 1);
      ctx.fillRect(x - m.size + 1, cy - 2, m.size * 2 - 1, 1);
    }
    ctx.fillStyle = '#0a120d';
    ctx.fillRect(0, h - 2, w, 2);
    /* spores rising */
    for (const s of spores) {
      const alpha = .12 + .3 * (.5 + .5 * Math.sin(time * .001 + s.phase)), y = ((s.y - time * .001 * s.speed) % h + h) % h;
      ctx.fillStyle = 'rgba(150,240,160,' + alpha.toFixed(3) + ')';
      ctx.fillRect(s.x | 0, y | 0, s.size, s.size);
    }
  }

  resize();
  addEventListener('resize', resize);
  if (!still) setInterval(() => { if (!document.hidden) draw(performance.now()); }, 130);
})();

/* src/ui/main.js */
/* Start-up. Extra scripts added by build.js --extra run just before this file. */
Book.build();
Store.load();
App.applyLang();
App.render();
Engine.init();
</script>
