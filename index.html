<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>betterchess</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Pixelify+Sans:wght@400..700&display=swap">
<style>
/* Layout: one phone-width column, board first, coach under it; two columns from 900px.
   Same cave world as Qliphoth, lit in green: dark stone slabs, pixel frames, phosphorescent accent. */
:root{
  color-scheme:dark;
  --bg:#060b08; --bg2:#0b130e; --surface:#111c15; --surface2:#19281e; --line:#2c4634;
  --fg:#e9f3e4; --muted:#a9bfae; --faint:#6f8a77;
  --accent:#c4f5a6; --accent2:#58c46f; --glow:#62e07f; --on-accent:#07100a;
  --sq-lt:#b8dca0; --sq-dk:#4c8a5a;
  --ok:#9ad9a6; --ko:#eb9082; --warn:#e9c46a;
  --font-display:"Pixelify Sans","Courier New",ui-monospace,monospace;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
#cave{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;image-rendering:pixelated}
.app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 16px 104px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:24px} h2{font-size:20px} h3{font-size:17px}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
[hidden]{display:none!important}
.label{font-family:var(--font-display);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px}
.card,.btn,.toast,.seg,.pbar,.moves{
  box-shadow:0 -2px 0 0 var(--bd,var(--line)),0 2px 0 0 var(--bd,var(--line)),-2px 0 0 0 var(--bd,var(--line)),2px 0 0 0 var(--bd,var(--line));
  margin:2px}
.card{background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.soft{background:var(--bg2)}
.card.glow{--bd:var(--accent2)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.right{text-align:right}
.cols3{display:grid;gap:14px;align-items:start}
.btn{font-family:var(--font-display);font-size:16px;line-height:1.2;background:var(--surface2);color:var(--fg);border:0;
  padding:10px 14px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--on-accent);--bd:var(--accent2);font-weight:600}
.btn.ko{--bd:var(--ko);color:var(--ko)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:calc(100% - 4px)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.chip{font-family:var(--font-display);font-size:12.5px;letter-spacing:.03em;padding:2px 8px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)} .chip.acc{color:var(--accent)}

.top{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 8px;background:linear-gradient(var(--bg) 78%,transparent)}
.top{flex-wrap:wrap}
.top .row{flex-wrap:nowrap;gap:8px}
.top h1{color:var(--accent);text-shadow:0 0 14px color-mix(in srgb,var(--glow) 55%,transparent),2px 2px 0 var(--bg)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bg2);border-top:2px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nav button{background:transparent;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 4px;min-height:52px;
  font-family:var(--font-display);font-size:13px;color:var(--faint);letter-spacing:.03em}
.nav button svg{width:22px;height:22px;opacity:.55;color:var(--accent2)}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"] svg{opacity:1;filter:drop-shadow(0 0 6px var(--glow))}
.nav button[aria-current="page"]::after{content:"";width:18px;height:2px;background:var(--accent2)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--surface2);--bd:var(--accent2);
  padding:8px 14px;font-family:var(--font-display);font-size:15px;color:var(--accent);pointer-events:none;max-width:calc(100% - 40px);text-align:center}

/* lobby */
.elo{font-family:var(--font-display);font-size:58px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent);
  text-shadow:0 0 18px color-mix(in srgb,var(--glow) 55%,transparent)}
.stat-num{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat-num small{font-size:14px}
.seg{display:flex;background:var(--bg2);padding:3px;gap:3px}
.seg button{flex:1;font-family:var(--font-display);font-size:14.5px;background:transparent;border:0;color:var(--muted);padding:8px 6px;min-height:40px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent2);min-height:32px}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer;min-height:44px}
.switch input{width:22px;height:22px;accent-color:var(--accent2);flex:none}

/* game and exercises */
.game{display:flex;flex-direction:column;gap:10px}
.left,.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);padding:6px 10px;min-height:44px}
.pbar .who{font-family:var(--font-display);font-size:16px;display:flex;align-items:center;gap:8px;min-width:0}
.pbar .who i{width:12px;height:12px;flex:none;box-shadow:0 0 0 2px var(--line)}
.pbar .who i.w{background:#f2f8e6} .pbar .who i.b{background:#1f2e24}
.clock{font-family:var(--font-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 8px;background:var(--bg2);color:var(--muted)}
.clock.on{background:var(--accent);color:var(--on-accent)}
.clock.low{background:var(--ko);color:#1b0806}
.bwrap{display:flex;gap:6px;align-items:stretch}
.evalbar{flex:none;width:12px;background:#1f2e24;position:relative;box-shadow:0 0 0 2px var(--line);margin:2px}
.evalbar i{position:absolute;left:0;right:0;bottom:0;background:#f2f8e6;transition:height .4s ease}
.evalbar.flip i{bottom:auto;top:0}
.board{flex:1;min-width:0;display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;position:relative;box-shadow:0 0 0 2px var(--line),0 0 28px color-mix(in srgb,var(--glow) 22%,transparent);margin:2px;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
.sq{position:relative;border:0;padding:0;margin:0;cursor:pointer;aspect-ratio:1;min-width:0;display:block;-webkit-tap-highlight-color:transparent}
.sq.lt{background:var(--sq-lt)} .sq.dk{background:var(--sq-dk)}
.sq.last.lt{background:#e3e98a} .sq.last.dk{background:#a9b84e}
.sq.sel{background:#f0d98a!important}
.sq.chk{background:#e2695c!important}
.sq.hint{box-shadow:inset 0 0 0 4px #f0d98a}
.sq:focus-visible{outline-offset:-3px;z-index:2}
.pc{position:absolute;inset:2%;background-size:contain;background-repeat:no-repeat;background-position:center;image-rendering:pixelated;pointer-events:none}
.dot{position:absolute;left:36%;top:36%;width:28%;height:28%;background:rgba(7,16,10,.42);pointer-events:none}
.ring{position:absolute;inset:0;box-shadow:inset 0 0 0 5px rgba(7,16,10,.42);pointer-events:none}
.co{position:absolute;font-family:var(--font-display);font-size:10px;line-height:1;pointer-events:none}
.co.r{left:2px;top:2px} .co.f{right:2px;bottom:1px}
.lt .co{color:#3c6f49} .dk .co{color:#cfe9bd}
.bdg{position:absolute;right:-6px;top:-6px;z-index:3;min-width:22px;height:22px;padding:0 3px;font-family:var(--font-display);font-size:13px;font-weight:700;line-height:22px;text-align:center;
  background:var(--c);color:#07100a;box-shadow:0 0 0 2px #07100a;pointer-events:none}
.arrow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.promo{position:absolute;inset:0;z-index:5;background:rgba(6,11,8,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.promo .row{justify-content:center}
.promo button{width:64px;height:64px;position:relative;background:var(--sq-lt);border:0;cursor:pointer;box-shadow:0 0 0 2px var(--accent2)}
.promo .btn{width:auto;height:auto}
.c-brilliant{--c:#3fd6c0} .c-great{--c:#86b7ff} .c-best{--c:#8fe06a} .c-excellent{--c:#a8e08a} .c-good{--c:#8fc49a}
.c-book{--c:#d3b27c} .c-inaccuracy{--c:#e9c46a} .c-mistake{--c:#f0954a} .c-miss{--c:#ee8a7c} .c-blunder{--c:#e85a52} .c-forced{--c:#a9bfae}
.coach{--bd:var(--c,var(--line));min-height:92px}
.coach .ttl{font-family:var(--font-display);font-size:19px;color:var(--c,var(--fg));display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.coach .ttl b{background:var(--c);color:#07100a;padding:0 6px;font-size:15px;min-width:24px;text-align:center}
.moves{background:var(--bg2);padding:8px;display:flex;flex-wrap:wrap;gap:2px 4px;max-height:132px;overflow-y:auto;align-content:flex-start}
.moves .n{font-family:var(--font-display);font-size:13px;color:var(--faint);padding:4px 0 4px 4px;min-width:26px;text-align:right}
.moves button{font-family:var(--font-display);font-size:15px;background:transparent;border:0;cursor:pointer;padding:3px 5px;min-height:30px;color:var(--fg);border-bottom:3px solid transparent}
.moves button.mine{border-bottom-color:var(--c,transparent)}
.moves button[aria-current="true"]{background:var(--surface2);color:var(--accent)}
.result h2{font-size:26px;color:var(--accent)}
.delta{font-family:var(--font-display);font-size:22px;font-weight:700}
.delta.up{color:var(--ok)} .delta.down{color:var(--ko)}
.tally{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 14px}
.tally div{display:flex;align-items:center;gap:8px;font-size:15px}
.tally b{background:var(--c);color:#07100a;font-family:var(--font-display);font-size:13px;min-width:24px;text-align:center;padding:0 4px}
.tally span.k{margin-left:auto;font-family:var(--font-display);font-variant-numeric:tabular-nums}

/* openings and tactics lists */
.ops{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.op{display:flex;align-items:center;gap:10px;width:calc(100% - 4px);background:var(--surface);border:0;cursor:pointer;text-align:left;padding:10px 12px;min-height:52px;
  box-shadow:-4px 0 0 0 var(--c),0 -2px 0 0 var(--line),0 2px 0 0 var(--line),2px 0 0 0 var(--line);margin:2px 2px 2px 4px}
.op .o-name{font-family:var(--font-display);font-size:16px}
.op .o-sub{font-size:13.5px;color:var(--muted)}
.bar{display:flex;gap:2px}
.bar i{flex:1;height:8px;background:var(--surface2)}
.bar i.on{background:var(--accent)}
.bar i.cur{background:var(--warn)}
.line{font-family:var(--font-display);font-size:15px;color:var(--muted);line-height:1.6}
.verdict{font-family:var(--font-display);font-size:18px}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--ko)}

/* "understand" panels and style tags */
.tags{display:inline-flex;flex-wrap:wrap;gap:4px}
.chip.tag{color:var(--accent);background:var(--bg2);box-shadow:inset 0 0 0 1px var(--line)}
.learn{gap:0}
.learn summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;list-style:none;min-height:32px}
.learn summary::-webkit-details-marker{display:none}
.learn summary::after{content:"+";font-family:var(--font-display);color:var(--muted);font-size:18px}
.learn[open] summary::after{content:"−"}
.learn dl{margin:10px 0 0;display:flex;flex-direction:column;gap:10px}
.lr{border-left:4px solid var(--line);padding-left:10px}
.lr.str{border-left-color:var(--ok)} .lr.weak{border-left-color:var(--ko)}
.lr dt{font-family:var(--font-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.lr dd{margin:2px 0 0;max-width:65ch}
.picons{display:inline-flex;gap:2px}
.picons .pc{position:relative;inset:auto;display:inline-block;width:24px;height:24px;background-color:var(--sq-dk)}
.theme h3{color:var(--accent)}
.theme .learn{background:var(--bg2);margin-top:4px}

/* profile */
.graph{width:100%;height:auto;display:block;background:var(--bg2)}
.hist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.hist li{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:2px dotted var(--line);font-size:14.5px;flex-wrap:wrap}
.hist li:first-child{border-top:0}
.hist .r{font-family:var(--font-display);font-size:15px;min-width:70px}
.r.w{color:var(--ok)} .r.l{color:var(--ko)} .r.d{color:var(--warn)}

/* wide screens: board and side panel side by side, the board as tall as the window allows */
@media (min-width:900px){
  .app{max-width:1560px}
  .game{display:grid;grid-template-columns:minmax(0,min(calc(100vh - 292px),1040px)) minmax(300px,440px);gap:14px 28px;align-items:start;justify-content:center}
  .cols3{grid-template-columns:repeat(3,1fr)}
  .co{font-size:13px} .bdg{min-width:30px;height:30px;line-height:30px;font-size:17px;right:-8px;top:-8px}
  .clock{font-size:30px} .coach .ttl{font-size:24px} .moves button{font-size:17px}
  .game .left{grid-column:1} .game .side{grid-column:2}
  .moves{max-height:260px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
}
@media (prefers-reduced-motion:reduce){.evalbar i{transition:none}}
</style>
</head>
<body>
<canvas id="cave" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <h1>betterchess</h1>
    <span class="row">
      <select id="langSel" class="btn sm"></select>
      <button class="btn sm" id="sndBtn" data-act="sound" aria-pressed="true"></button>
      <span class="chip warn" id="engChip">…</span>
    </span>
  </header>
  <main id="view"></main>
</div>
<nav class="nav"><div class="nav-in">
  <button data-act="nav" data-view="play"><svg viewBox="0 0 11 11" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><rect x="5" y="0" width="1" height="3"/><rect x="4" y="1" width="3" height="1"/><rect x="3" y="3" width="5" height="1"/><rect x="2" y="4" width="7" height="3"/><rect x="3" y="7" width="5" height="1"/><rect x="2" y="8" width="7" height="1"/><rect x="1" y="9" width="9" height="2"/></svg><span></span></button>
  <button data-act="nav" data-view="openings"><svg viewBox="0 0 11 11" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="1" width="4" height="8"/><rect x="6" y="1" width="4" height="8"/><rect x="5" y="2" width="1" height="8"/><rect x="1" y="9" width="9" height="1"/></svg><span></span></button>
  <button data-act="nav" data-view="tactics"><svg viewBox="0 0 11 11" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="1" width="2" height="2"/><rect x="4" y="1" width="2" height="2"/><rect x="7" y="1" width="2" height="2"/><rect x="2" y="4" width="7" height="1"/><rect x="5" y="4" width="1" height="6"/><rect x="3" y="9" width="5" height="1"/><rect x="1" y="10" width="9" height="1"/></svg><span></span></button>
  <button data-act="nav" data-view="profile"><svg viewBox="0 0 11 11" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="8" width="2" height="2"/><rect x="4" y="5" width="2" height="5"/><rect x="7" y="2" width="2" height="8"/><rect x="0" y="10" width="11" height="1"/></svg><span></span></button>
</div></nav>
<div id="toast" class="toast" role="status" hidden></div>

<script>
/* src/chess/core.js */
/* Chess rules and a small built-in engine, with no dependency.
 *
 * Board: 0x88 layout. Square index = rank * 16 + file (a1 = 0, h8 = 119); an index with
 * (sq & 0x88) set is off the board.
 * Piece: type | colour << 3, with type 1..6 = pawn, knight, bishop, rook, queen, king
 * and colour 0 = white, 1 = black. 0 is an empty square.
 * Move: a packed integer  from | to << 7 | promotion type << 14 | flag << 17,
 * flag 1 = en passant, 2 = castle king side, 3 = castle queen side, 4 = pawn double step.
 *
 * The built-in engine (think) is a plain alpha-beta search with quiescence, about 1500 Elo.
 * It is the fallback when Stockfish cannot be loaded, and it also runs in a Web Worker:
 * keep ChessLib self-contained (no reference to outer variables).
 */
function ChessLib() {
  const WHITE = 0, BLACK = 1;
  const PAWN = 1, KNIGHT = 2, BISHOP = 3, ROOK = 4, QUEEN = 5, KING = 6;
  const EP = 1, CASTLE_K = 2, CASTLE_Q = 3, DOUBLE = 4;

  const KNIGHT_STEPS = [-33, -31, -18, -14, 14, 18, 31, 33];
  const KING_STEPS = [-17, -16, -15, -1, 1, 15, 16, 17];
  const DIAGONALS = [-17, -15, 15, 17];
  const LINES = [-16, -1, 1, 16];
  const PROMOTIONS = [QUEEN, KNIGHT, ROOK, BISHOP];

  const START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
  const VAL = [0, 100, 320, 330, 500, 900, 0];
  const MATE = 100000, INF = 1000000;

  /* Castling rights are 4 bits: 1 = K, 2 = Q, 4 = k, 8 = q. A move from or to one of these
     squares clears the matching rights (castle &= CASTLE_MASK[from] & CASTLE_MASK[to]). */
  const CASTLE_MASK = new Int8Array(128).fill(15);
  CASTLE_MASK[0] = 13; CASTLE_MASK[7] = 14; CASTLE_MASK[4] = 12;
  CASTLE_MASK[112] = 7; CASTLE_MASK[119] = 11; CASTLE_MASK[116] = 3;

  /* Piece-square tables, from White's point of view, a8 first (index = (7 - rank) * 8 + file). */
  const PST = [null,
    [0,0,0,0,0,0,0,0,50,50,50,50,50,50,50,50,10,10,20,30,30,20,10,10,5,5,10,25,25,10,5,5,0,0,0,20,20,0,0,0,5,-5,-10,0,0,-10,-5,5,5,10,10,-20,-20,10,10,5,0,0,0,0,0,0,0,0],
    [-50,-40,-30,-30,-30,-30,-40,-50,-40,-20,0,0,0,0,-20,-40,-30,0,10,15,15,10,0,-30,-30,5,15,20,20,15,5,-30,-30,0,15,20,20,15,0,-30,-30,5,10,15,15,10,5,-30,-40,-20,0,5,5,0,-20,-40,-50,-40,-30,-30,-30,-30,-40,-50],
    [-20,-10,-10,-10,-10,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,10,10,5,0,-10,-10,5,5,10,10,5,5,-10,-10,0,10,10,10,10,0,-10,-10,10,10,10,10,10,10,-10,-10,5,0,0,0,0,5,-10,-20,-10,-10,-10,-10,-10,-10,-20],
    [0,0,0,0,0,0,0,0,5,10,10,10,10,10,10,5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,0,0,0,5,5,0,0,0],
    [-20,-10,-10,-5,-5,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,5,5,5,0,-10,-5,0,5,5,5,5,0,-5,0,0,5,5,5,5,0,-5,-10,5,5,5,5,5,0,-10,-10,0,5,0,0,0,0,-10,-20,-10,-10,-5,-5,-10,-10,-20],

/* src/i18n/i18n.js */
/* Translations. Every language lives in its own file (src/i18n/<code>.js) and registers itself here.
 * To add a language: copy en.js to <code>.js, translate the values (keep the keys), then add
 * a <script> line for it in src/index.html. The language menu picks it up automatically,
 * and `npm test` checks that no key is missing.
 */
const I18N = {};
let LANG = 'en';

/* Browser languages in order of preference; English when none is available. */
function detectLang() {
  const prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  for (const p of prefs) {
    const code = String(p).slice(0, 2).toLowerCase();
    if (I18N[code]) return code;
  }
  return 'en';
}

function setLang(code) {
  LANG = I18N[code] ? code : detectLang();
  document.documentElement.lang = LANG;
}

/* t('result.newElo', { elo: 812 }) → "New Elo: 812 …". Falls back to English, then to the key.
   A value given as [singular, plural] is chosen with vars.n. */
function t(key, vars) {
  let s = I18N[LANG].ui[key];
  if (s === undefined) s = I18N.en.ui[key];
  if (s === undefined) return key;
  if (Array.isArray(s)) s = s[vars && vars.n === 1 ? 0 : 1];
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}

/* Translated data tables (opening names, explanations), with English as fallback. */
function lookup(path, id) {
  const pick = lang => path.reduce((o, k) => o && o[k], I18N[lang]);
  const table = pick(LANG);
  return (table && table[id]) || pick('en')[id];
}
const openingName = o => lookup(['openings'], o.id)[0];
const openingIdea = o => lookup(['openings'], o.id)[1];
const learnText = (kind, id) => lookup(['learn', kind], id); // kind: 'openings' | 'themes'

/* Piece letters in move notation follow the language, e.g. Nf3 → Cf3 in French. */
function localSan(san) {
  const letters = I18N[LANG].pieces;
  return san.replace(/[KQRBN]/g, c => letters['KQRBN'.indexOf(c)]);
}
const localDecimal = s => s.replace('.', I18N[LANG].decimal);

if (typeof module !== 'undefined') module.exports = I18N;

/* src/ui/util.js */
/* Small helpers shared by every screen. */
const Chess = ChessLib();

const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
const randInt = n => Math.floor(Math.random() * n);
const clone = o => JSON.parse(JSON.stringify(o));

/* Moves are packed integers, see src/chess/core.js. */
const Move = {
  from: m => m & 127,
  to: m => (m >> 7) & 127,
  promo: m => (m >> 14) & 7,
  flag: m => m >> 17,
  EN_PASSANT: 1, CASTLE_K: 2, CASTLE_Q: 3,
  QUEEN: 5,
};
const colourOf = piece => piece >> 3;
const sideName = black => t(black ? 'lobby.black' : 'lobby.white');

/* Local day number, so "of the day" items change at local midnight. */
function dayIndex() {
  const d = new Date();
  return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000);
}

/* "Arm then confirm" buttons (resign, reset): the first click arms for 4 s, the second confirms. */
const ARM_MS = 4000;
const isArmed = since => Date.now() - since < ARM_MS;

let toastTimer = 0;
function toast(text) {
  const el = $('#toast');
  el.textContent = text;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

/* Shared markup bits */
function statusChip(stat, okKey, prefix) {
  if (stat.ok) return '<span class="chip ok">' + t(okKey, { n: stat.ok }) + '</span>';
  if (stat.tries) return '<span class="chip warn">' + t(prefix + '.retry') + '</span>';
  return '<span class="chip">' + t(prefix + '.new') + '</span>';
}
function verdict(ok, text) {
  return '<p class="verdict ' + (ok ? 'ok' : 'ko') + '" aria-live="polite">' + esc(text) + '</p>';
}
function button(act, label, cls, extra) {
  return '<button class="btn' + (cls ? ' ' + cls : '') + '" data-act="' + act + '"' + (extra || '') + '>' + label + '</button>';
}

      let rects = '';
      for (let y = 0; y < size; y++) {
        /* one rect per horizontal run of the same letter */
        for (let x = 0; x < size;) {
          const ch = rows[y][x];
          let run = 1;
          while (x + run < size && rows[y][x + run] === ch) run++;
          if (ch !== '.') rects += '<rect x="' + x + '" y="' + y + '" width="' + run + '" height="1" fill="' + PIECE_TONES[colour][ch] + '"/>';
          x += run;
        }
      }
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '" shape-rendering="crispEdges">' + rects + '</svg>';
      css += '.pc.' + colour + type + '{background-image:url("data:image/svg+xml,' + encodeURIComponent(svg) + '")}';
    }
  }
  const style = document.createElement('style');
  style.textContent = css;
  document.head.appendChild(style);
})();

/* src/ui/sound.js */
/* Sounds, synthesised with the Web Audio API: no audio file to ship or license.
   Browsers only allow audio after a user gesture, hence wake() on the first pointer press. */
const Sound = {
  ctx: null,

  wake() {
    try {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { /* no audio available */ }
  },

  /* wooden "knock": filtered noise burst plus a falling sine thump */
  knock(at, freq, vol, len) {
    const c = this.ctx, n = Math.floor(c.sampleRate * len), buf = c.createBuffer(1, n, c.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    const noise = c.createBufferSource(), band = c.createBiquadFilter(), gain = c.createGain();
    noise.buffer = buf;
    band.type = 'bandpass'; band.frequency.value = freq; band.Q.value = 1.4;
    gain.gain.value = vol;
    noise.connect(band); band.connect(gain); gain.connect(c.destination);
    noise.start(at);

    const osc = c.createOscillator(), og = c.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq * .28, at);
    osc.frequency.exponentialRampToValueAtTime(freq * .12, at + len);
    og.gain.setValueAtTime(vol * .9, at);
    og.gain.exponentialRampToValueAtTime(.001, at + len);
    osc.connect(og); og.connect(c.destination);
    osc.start(at); osc.stop(at + len + .02);
  },

  tone(at, freq, len, vol, type) {
    const c = this.ctx, osc = c.createOscillator(), gain = c.createGain();
    osc.type = type || 'triangle';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(.0001, at);
    gain.gain.exponentialRampToValueAtTime(vol, at + .012);
    gain.gain.exponentialRampToValueAtTime(.001, at + len);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(at); osc.stop(at + len + .03);
  },

  /* name → recipe; `at` is the start time */
  recipes: {
    move(at) { this.knock(at, 820, .5, .07); },
    capture(at) { this.knock(at, 1250, .75, .06); this.knock(at + .045, 620, .6, .09); },
    castle(at) { this.knock(at, 820, .5, .07); this.knock(at + .13, 700, .5, .07); },
    promote(at) { this.knock(at, 820, .5, .07); this.tone(at + .05, 784, .18, .16); this.tone(at + .13, 1175, .25, .16); },
    check(at) { this.knock(at, 900, .55, .07); this.tone(at + .03, 988, .16, .2, 'square'); this.tone(at + .14, 1319, .22, .18, 'square'); },
    mate(at) { this.knock(at, 700, .8, .12); this.tone(at + .04, 196, .7, .25, 'sawtooth'); this.tone(at + .04, 293.7, .7, .18, 'square'); },
    win(at) { [523, 659, 784, 1047].forEach((f, i) => this.tone(at + i * .13, f, .5, .2)); },
    lose(at) { [523, 440, 349, 262].forEach((f, i) => this.tone(at + i * .16, f, .55, .2)); },
    draw(at) { this.tone(at, 440, .4, .18); this.tone(at + .18, 440, .5, .18); },
    wrong(at) { this.tone(at, 160, .18, .2, 'square'); },
    start(at) { this.tone(at, 659, .14, .14); this.tone(at + .1, 880, .2, .14); },
  },

  play(name) {
    if (!Store.profile.sound || !this.ctx || this.ctx.state !== 'running') return;
    try { this.recipes[name].call(this, this.ctx.currentTime + .01); } catch (e) { /* ignore audio errors */ }
  },

  /* Sound for a move that was just played. pos is the position after the move. */
  forMove(m, pos, captured) {
    if (pos.inCheck()) return this.play(pos.legal().length ? 'check' : 'mate');
    const flag = Move.flag(m);
    if (flag === Move.CASTLE_K || flag === Move.CASTLE_Q) this.play('castle');
    else if (Move.promo(m)) this.play('promote');
    else if (captured || flag === Move.EN_PASSANT) this.play('capture');
    else this.play('move');
  },
};

document.addEventListener('pointerdown', () => Sound.wake(), true);

/* src/ui/store.js */
/* The player's profile, saved in localStorage.
 * Extra scripts (see build.js --extra) can keep it elsewhere too:
 *   Store.onSave(fn)       fn(profileCopy) after every save
 *   Store.replace(raw)     load a profile coming from elsewhere (returns false if it is not valid),
 *                          then App.refreshIfIdle() to redraw without interrupting a game
 *   Store.migrations.push(fn)  fn(raw) → raw, to upgrade old data before it is read
 */
const STORAGE_KEY = 'betterchess';
const PROFILE_VERSION = 1;
const HISTORY_SIZE = 80;
const DEFAULT_PROFILE = {
  v: PROFILE_VERSION,
  elo: 500, best: 500, games: 0,
  record: { w: 0, d: 0, l: 0 },  // ranked games won, drawn, lost
  history: [],                   // last games, see Game.finish
  openings: {},                  // opening id → { ok, tries, at }
  tactics: {},                   // puzzle id → { ok, tries, at }
  sound: true,
  lang: null,                    // null: follow the browser
  savedAt: 0,
};

const Store = {
  profile: clone(DEFAULT_PROFILE),
  synced: false,  // set by a sync script when the profile is also kept in an account
  migrations: [],
  listeners: [],

  normalize(raw) {
    for (const migrate of this.migrations) raw = migrate(raw) || raw;
    if (!raw || raw.v !== PROFILE_VERSION) return null;
    return Object.assign(clone(DEFAULT_PROFILE), raw);
  },

  load() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      const p = saved && this.normalize(JSON.parse(saved));
      if (p) this.profile = p;
    } catch (e) { /* storage unavailable or corrupted: keep the default */ }
  },

  writeLocal() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.profile)); } catch (e) { /* private mode, quota… */ }
  },

  save() {
    this.profile.savedAt = Date.now();
    this.writeLocal();
    for (const fn of this.listeners) fn(clone(this.profile));
  },

  onSave(fn) { this.listeners.push(fn); },

  replace(raw) {
    const p = this.normalize(clone(raw));
    if (!p) return false;
    this.profile = p;
    this.writeLocal();
    return true;
  },

  reset() {
    this.profile = clone(DEFAULT_PROFILE);
    this.profile.lang = LANG;
    this.save();
  },

  /* opening drills and puzzles: bucket is 'openings' or 'tactics' */
  exercise(bucket, id) {
    return this.profile[bucket][id] || { ok: 0, tries: 0 };
  },
  recordExercise(bucket, id, clean) {
    const s = this.exercise(bucket, id);
    s.tries++;
    if (clean) s.ok++;
    s.at = Date.now();
    this.profile[bucket][id] = s;
    this.save();
  },
  solvedCount(bucket, list) {
    return list.filter(x => this.exercise(bucket, x.id).ok).length;
  },

  addGame(entry) {
    const h = this.profile.history;
    h.push(entry);
    if (h.length > HISTORY_SIZE) h.splice(0, h.length - HISTORY_SIZE);
    this.save();
  },
};

/* src/ui/engine.js */
/* Engine access. Stockfish (stockfish.js 10, GPLv3) is loaded from a CDN inside a Web Worker;
 * if every CDN fails, or Stockfish stops answering, the built-in engine of core.js takes over,
 * itself running in a worker built from ChessLib's source.
 *
 * analyse(fen, { multipv }) → Promise of [{ uci, cp, mate, depth }], best first, scores from the
 * side to move's view. Requests are queued: one analysis at a time.
 */
const STOCKFISH_URLS = [
  'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js',
  'https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js',
  'https://unpkg.com/stockfish.js@10.0.2/stockfish.js',
];
const STOCKFISH_LOAD_TIMEOUT = 25000;
const STOCKFISH_MOVE_TIMEOUT = 9000;

const Engine = {
  kind: 'builtin', // 'stockfish' once loaded
  sfName: '',
  sf: null,
  builtin: null,
  pending: new Map(),
  nextId: 0,
  queue: Promise.resolve(),

  get name() {
    return this.kind === 'stockfish' ? (this.sfName || 'Stockfish').split(' by ')[0] : t('engine.builtin');
  },

  workerFrom(source) {
    return new Worker(URL.createObjectURL(new Blob([source], { type: 'text/javascript' })));
  },

  init() {
    this.startBuiltin();
    this.loadStockfish();
  },

  startBuiltin() {
    try {
      this.builtin = this.workerFrom(ChessLib.toString() +
        ';var lib=ChessLib(),pos=lib.create();' +
        'onmessage=function(e){pos.load(e.data.fen);postMessage({id:e.data.id,res:pos.think(e.data.opt)})}');
      this.builtin.onmessage = e => {
        const done = this.pending.get(e.data.id);
        if (done) { this.pending.delete(e.data.id); done(e.data.res); }
      };
      this.builtin.onerror = () => {
        this.builtin = null;
        for (const done of this.pending.values()) done(null);
        this.pending.clear();
      };
    } catch (e) { this.builtin = null; }
  },

  loadStockfish() {
    /* the worker tries each URL; stockfish.js either installs its own onmessage
       or exposes a STOCKFISH() factory that we wire up */
    const source = 'var ok=false,urls=' + JSON.stringify(STOCKFISH_URLS) + ';' +
      'for(var i=0;i<urls.length&&!ok;i++){try{importScripts(urls[i]);ok=true}catch(e){}}' +
      'if(ok&&typeof onmessage!=="function"&&typeof STOCKFISH==="function"){' +
      'var sf=STOCKFISH();sf.onmessage=function(l){postMessage(typeof l==="string"?l:l.data)};onmessage=function(e){sf.postMessage(e.data)}}' +
      'postMessage(ok?"__loaded":"__fail");';
    try {
      const w = this.workerFrom(source);
      const fail = () => { clearTimeout(timer); try { w.terminate(); } catch (e) {} App.paintEngine(); };
      const timer = setTimeout(fail, STOCKFISH_LOAD_TIMEOUT);
      w.onerror = fail;
      w.onmessage = e => {
        const line = e.data;
        if (typeof line !== 'string') return;
        if (line === '__fail') fail();
        else if (line === '__loaded') w.postMessage('uci');
        else if (line.startsWith('id name')) this.sfName = line.slice(8).trim();
        else if (line.includes('uciok')) {
          clearTimeout(timer);
          w.onerror = null;
          w.postMessage('setoption name Hash value 16');
          w.postMessage('ucinewgame');
          this.sf = w;
          this.kind = 'stockfish';
          App.paintEngine();
        }
      };
    } catch (e) { /* workers unavailable: built-in engine only */ }
  },

  analyse(fen, o) {
    const run = () => this.kind === 'stockfish' ? this.runStockfish(fen, o || {}) : this.runBuiltin(fen, o || {});
    const p = this.queue.then(run, run);
    this.queue = p.catch(() => {});
    return p;
  },

  runBuiltin(fen, o) {
    const opt = { multipv: o.multipv || 1, depth: 6, movetime: 650 };
    /* without workers, search on the main thread with a shorter budget */
    const inline = () => Chess.create(fen).think(Object.assign({}, opt, { movetime: 300, depth: 4 }));
    if (!this.builtin) return sleep(20).then(inline);
    return new Promise(resolve => {
      const id = ++this.nextId;
      this.pending.set(id, res => resolve(res || inline()));
      this.builtin.postMessage({ id, fen, opt });
    });
  },

  runStockfish(fen, o) {
    return new Promise(resolve => {
      const w = this.sf, lines = {};
      let done = false;
      /* Stockfish stuck: drop it for good and answer with the built-in engine */
      const deadline = setTimeout(() => {
        if (done) return;
        done = true;
        this.kind = 'builtin';
        try { w.terminate(); } catch (e) {}
        App.paintEngine();
        resolve(this.runBuiltin(fen, o));
      }, STOCKFISH_MOVE_TIMEOUT);

      w.onmessage = e => {
        const line = e.data;
        if (typeof line !== 'string' || done) return;
        if (line.startsWith('info') && line.includes(' pv ')) {
          const info = parseInfo(line);
          if (info) lines[info.multipv] = info;
        } else if (line.startsWith('bestmove')) {
          done = true;
          clearTimeout(deadline);
          let out = Object.keys(lines).sort((a, b) => a - b).map(k => lines[k]).filter(x => x.uci);
          const best = line.split(' ')[1];
          if (!out.length && best && best !== '(none)') out = [{ uci: best, cp: 0, mate: null, depth: 0 }];
          out.sort((a, b) => b.cp - a.cp);
          resolve(out);
        }
      };
      w.postMessage('setoption name MultiPV value ' + (o.multipv || 1));
      w.postMessage('position fen ' + fen);
      w.postMessage('go depth 14 movetime 800');
    });
  },
};

/* "info depth 12 multipv 2 score cp -35 … pv e7e5 …" → { multipv, uci, cp, mate, depth }.
   Mates are mapped to ±(10000 - 10 * moves), like the built-in engine. */
function parseInfo(line) {
  const words = line.split(' ');
  const after = k => { const i = words.indexOf(k); return i < 0 ? null : words[i + 1]; };
  const si = words.indexOf('score');
  if (si < 0) return null;
  const v = +words[si + 2], mate = words[si + 1] === 'mate' ? v : null;
  const cp = mate === null ? v : (mate > 0 ? 10000 - mate * 10 : -10000 - mate * 10);
  return { multipv: +(after('multipv') || 1), uci: after('pv'), cp, mate, depth: +(after('depth') || 0) };
}

/* src/ui/coach.js */
/* The coach: rates the player's moves after they are played, picks the bot's moves, computes Elo.
 * It never shows the best move: it only compares the move played with the engine's lines.
 */

/* Move classes, best to worst, with their symbol. Names and comments are in i18n
   ("class.<name>", "comment.<name>"); colours in style.css (.c-<name>). */
const CLASSES = {
  brilliant: '!!', great: '!', best: '★', excellent: '✓', good: '+', book: '≡',
  inaccuracy: '?!', mistake: '?', miss: '×', blunder: '??', forced: '→',
};
/* classes counted in the end-of-game summary (a forced move says nothing about the player) */
const SUMMARY_CLASSES = Object.keys(CLASSES).filter(c => c !== 'forced');

/* Centipawns → probability of winning for the side to move (same curve as Lichess). */
const winChance = cp => 1 / (1 + Math.exp(-0.00368208 * cp));

/* Accuracy of one move from its loss of win chance (0..1), Lichess-style formula. */
function accuracy(loss) {
  return Math.max(0, Math.min(100, 103.1668 * Math.exp(-0.04354 * loss * 100) - 3.1669));
}

/* Rate one move.
 * m.pre      engine lines before the move, from the mover's view (best first)
 * m.after    engine lines after the move, from the opponent's view, or null when the game ended
 * m.final    the final score from the mover's view, when after is null (mate given: 9990, else 0)
 * m.uci      the move played
 * m.legalCount, m.inBook, m.sacrifice (material offered, from see()), m.pieceType, m.recapture
 * Returns { cls, loss } where loss is the win chance given away (0..1).
 */
function rateMove(m) {
  const pre = m.pre, best = pre[0];
  let cp;
  if (m.uci === best.uci) cp = best.cp;
  else {
    const line = pre.find(x => x.uci === m.uci);
    if (line) cp = line.cp;
    else {
      /* not among the engine's lines: score it from the reply analysis, no better than the worst line */
      cp = m.after ? -m.after[0].cp : m.final;
      cp = Math.min(cp, pre[pre.length - 1].cp);
    }
  }
  const bestChance = winChance(best.cp), playedChance = winChance(cp);
  const loss = Math.max(0, bestChance - playedChance);
  const top = m.uci === best.uci || loss < 0.002;
  const onlyGoodMove = pre.length > 1 && bestChance - winChance(pre[1].cp) >= 0.15;

  let cls;
  if (m.legalCount === 1) cls = 'forced';
  else if (m.inBook) cls = 'book';
  /* brilliant: a sound sacrifice of a piece (pawn moves excluded), in a position not already won */
  else if ((top || loss <= 0.02) && m.sacrifice >= 200 && m.pieceType !== 1 && playedChance >= 0.45 && bestChance <= 0.97 && best.mate !== 1) cls = 'brilliant';
  else if (top) cls = onlyGoodMove && !m.recapture && bestChance >= 0.35 ? 'great' : 'best';
  else if (loss > 0.10 && bestChance >= 0.80 && playedChance >= 0.40) cls = 'miss';
  else if (loss <= 0.02) cls = 'excellent';
  else if (loss <= 0.05) cls = 'good';
  else if (loss <= 0.10) cls = 'inaccuracy';
  else if (loss <= 0.20) cls = 'mistake';
  else cls = 'blunder';
  return { cls, loss };
}

/* Bot move for a given Elo, from the engine's lines (scores from the bot's view).
 * Weaker bots play more random moves and pick worse lines more often. */
function botMove(lines, elo, pos) {
  const legal = pos.legal();
  const randomMove = () => Chess.uci(legal[randInt(legal.length)]);
  if (!lines || !lines.length) return randomMove();
  if (lines[0].mate === 1 && Math.random() < 0.5 + elo / 2000) return lines[0].uci;
  /* a free capture is rarely missed, even by a beginner */
  const freeCapture = pos.get(Chess.sqIdx(lines[0].uci.slice(2, 4))) && (lines.length < 2 || lines[0].cp - lines[1].cp >= 200);
  const randomRate = Math.max(0, 0.40 - (elo - 400) / 3250) * (freeCapture ? 0.2 : 1);
  if (Math.random() < randomRate) return randomMove();
  /* softmax over the lines: the lower the Elo, the flatter the choice */
  const temperature = Math.max(1, 180 - elo * 0.075);
  const weights = lines.map(x => Math.exp(-(lines[0].cp - x.cp) / temperature));
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < weights.length; i++) {
    r -= weights[i];
    if (r <= 0) return lines[i].uci;
  }
  return lines[0].uci;
}

/* Elo change after a ranked game, the bot playing at the player's own Elo (expected score 0.5).
   The first 10 games count more, to find the player's level faster. */
const PLACEMENT_GAMES = 10;
const eloK = games => games < PLACEMENT_GAMES ? 48 : 32;
const eloDelta = (score, games) => Math.round(eloK(games) * (score - 0.5));

/* src/ui/book.js */
/* Opening book built from OPENINGS: used by the bot (it plays book moves), by the coach
 * ("book" moves) and to name the opening of a game.
 */
const Book = {
  moves: new Map(),    // position key → Set of book moves (uci)
  openings: new Map(), // position key → Set of opening ids reaching it

  build() {
    for (const o of OPENINGS) {
      const pos = Chess.create();
      o.line = o.moves.split(' ');
      for (const san of o.line) {
        const m = pos.fromSan(san);
        if (!m) throw new Error('Illegal move ' + san + ' in opening ' + o.id);
        addTo(this.moves, pos.key(), Chess.uci(m));
        pos.make(m);
        addTo(this.openings, pos.key(), o.id);
      }
    }
    function addTo(map, key, value) {
      if (!map.has(key)) map.set(key, new Set());
      map.get(key).add(value);
    }
  },

  has(key, uci) { return this.moves.has(key) && this.moves.get(key).has(uci); },
  randomMove(key) {
    const set = this.moves.get(key);
    return set ? [...set][randInt(set.size)] : null;
  },
  /* the opening id when only one opening goes through this position */
  openingAt(key) {
    const set = this.openings.get(key);
    return set && set.size === 1 ? [...set][0] : null;
  },
};

const openingById = id => OPENINGS.find(o => o.id === id);

/* src/ui/board.js */
/* Board drawing and click-to-move, shared by games, opening drills and puzzles. */

/* el: the .board element. v: what to show
 *   pos        position to draw            flip      true to see it from Black's side
 *   last       [from, to] of the last move  sel       selected square (-1: none)
 *   targets    squares the selected piece can go to
 *   hint       square to outline (-1: none) arrow     [from, to] to draw
 *   badge      { sq, cls } coach badge      promo     moves to choose from, shows the promotion picker
 */
function drawBoard(el, v) {
  const pos = v.pos, check = pos.inCheck() ? pos.kingSquare() : -1;
  let h = '';
  for (let i = 0; i < 64; i++) {
    const row = i >> 3, col = i & 7;
    const rank = v.flip ? row : 7 - row, file = v.flip ? 7 - col : col, sq = rank * 16 + file, piece = pos.get(sq);
    let cls = 'sq ' + ((rank + file) % 2 === 0 ? 'dk' : 'lt');
    if (v.last && (v.last[0] === sq || v.last[1] === sq)) cls += ' last';
    if (v.sel === sq) cls += ' sel';
    if (check === sq) cls += ' chk';
    if (v.hint === sq) cls += ' hint';
    h += '<button class="' + cls + '" data-act="square" data-sq="' + sq + '" aria-label="' + Chess.sqName(sq) + '">';
    if (piece) h += pieceIcon(piece & 7, colourOf(piece));
    if (v.targets && v.targets.includes(sq)) h += '<i class="' + (piece ? 'ring' : 'dot') + '"></i>';
    if (v.badge && v.badge.sq === sq) h += '<b class="bdg c-' + v.badge.cls + '">' + CLASSES[v.badge.cls] + '</b>';
    if (col === 0) h += '<span class="co r">' + (rank + 1) + '</span>';
    if (row === 7) h += '<span class="co f">' + 'abcdefgh'[file] + '</span>';
    h += '</button>';
  }
  if (v.arrow) h += arrowSvg(v.arrow, v.flip);
  if (v.promo) h += promotionPicker(v.promo, colourOf(pos.get(Move.from(v.promo[0]))));
  el.innerHTML = h;
}

/* type: 1..6 or a letter of "pnbrqk"; colour: 0 white, 1 black */
function pieceIcon(type, colour, title) {
  const letter = typeof type === 'number' ? ' pnbrqk'[type] : type;
  return '<i class="pc ' + (colour ? 'b' : 'w') + letter + '"' + (title ? ' title="' + esc(title) + '"' : '') + '></i>';
}

function arrowSvg([from, to], flip) {
  const centre = sq => { const r = sq >> 4, f = sq & 7; return [(flip ? 7 - f : f) + .5, (flip ? r : 7 - r) + .5]; };
  const a = centre(from), b = centre(to);
  const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
  const ex = b[0] - ux * .32, ey = b[1] - uy * .32; // where the shaft stops and the head starts
  return '<svg class="arrow" viewBox="0 0 8 8">' +
    '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + ex + '" y2="' + ey + '" stroke="#1f7a8c" stroke-opacity=".85" stroke-width=".2"/>' +
    '<polygon fill="#1f7a8c" fill-opacity=".9" points="' + (b[0] - ux * .05) + ',' + (b[1] - uy * .05) + ' ' +
    (ex - uy * .24) + ',' + (ey + ux * .24) + ' ' + (ex + uy * .24) + ',' + (ey - ux * .24) + '"/></svg>';
}

function promotionPicker(moves, colour) {
  return '<div class="promo"><span class="label">' + t('board.promotion') + '</span><div class="row">' +
    moves.map(m => '<button data-act="promote" data-move="' + m + '" aria-label="' + t('piece.' + ' pnbrq'[Move.promo(m)]) + '">' +
      pieceIcon(Move.promo(m), colour) + '</button>').join('') +
    '</div><button class="btn sm" data-act="promote" data-move="0">' + t('board.cancel') + '</button></div>';
}

/* Click-to-move. sel holds { sel, targets, legal } for the screen; me is the player's colour.
   Returns the legal moves from the selected square to sq (four of them for a promotion),
   or null after updating the selection. */
function pickMove(sel, pos, sq, me) {
  if (sel.sel >= 0) {
    const moves = sel.legal.filter(m => Move.from(m) === sel.sel && Move.to(m) === sq);
    if (moves.length) return moves;
  }
  const piece = pos.get(sq);
  if (piece && colourOf(piece) === me && sel.sel !== sq) {
    sel.sel = sq;
    sel.legal = pos.legal();
    sel.targets = sel.legal.filter(m => Move.from(m) === sq).map(Move.to);
  } else clearSelection(sel);
  return null;
}
function clearSelection(sel) { sel.sel = -1; sel.targets = []; }
const newSelection = () => ({ sel: -1, targets: [], legal: [] });
const autoQueen = moves => moves.find(m => Move.promo(m) === Move.QUEEN) || moves[0];

/* Play m on pos with its sound. Returns true if the move captured something. */
function playMove(pos, m) {
  const captured = !!pos.get(Move.to(m)) || Move.flag(m) === Move.EN_PASSANT;
  pos.make(m);
  Sound.forMove(m, pos, captured);
  return captured;
}

/* src/ui/game.js */
/* Games against the engine: 10-minute clocks, ranked (no coach, Elo at stake) or casual
 * (optional live coach, take-backs allowed).
 *
 * Flow: on the player's turn the engine analyses the position (pre). After the player's move,
 * the engine analyses the reply position (after); both are used to rate the move, then the bot
 * picks its move from the same analysis.
 */
const CLOCK_MS = 10 * 60 * 1000;
const RESULT_KEYS = { w: 'result.win', d: 'result.draw', l: 'result.loss' };
const LOW_TIME_MS = 30000;

const Game = {
  current: null,
  lobby: { level: null, colour: 'random', coach: true },

  /* o: { mode: 'ranked'|'casual', kind: 'ranked'|'coached'|'custom' (for "play again"),
          coach, colour (0|1), botElo, fen (optional start position), opening (optional id) } */
  start(o) {
    const pos = Chess.create(o.fen || Chess.START);
    this.current = Object.assign(newSelection(), {
      pos, mode: o.mode, kind: o.kind, coachOn: !!o.coach, me: o.colour, botElo: o.botElo,
      fens: [pos.fen()], keys: [pos.key()], moves: [],
      clock: [CLOCK_MS, CLOCK_MS], tickAt: Date.now(), running: pos.turn(),
      over: null, done: false, thinking: false,
      pre: null, preFen: '',      // analysis of the position before the player's move
      coach: null,                // null | { pending: true } | { rec }: what the coach box shows
      evalWhite: 0,               // last evaluation, White's view, for the eval bar
      view: -1,                   // ply shown when reviewing, -1 = live
      promo: null, resignArmedAt: 0,
      opening: o.opening || null,
      outOfBook: !!o.fen,         // a game from a drill or a puzzle starts out of book
    });
    App.go('play');
    App.render();
    Sound.play('start');
    this.step(this.current);
  },

  isCurrent(g) { return this.current === g && !g.over; },
  tick(g) {
    if (g.running < 0) return;
    const now = Date.now();
    g.clock[g.running] = Math.max(0, g.clock[g.running] - (now - g.tickAt));
    g.tickAt = now;
  },
  /* evaluation from the player's view → White's view */
  setEval(g, cpForPlayer) { g.evalWhite = g.me === 0 ? cpForPlayer : -cpForPlayer; },

  endState(g) {
    const p = g.pos;
    if (!p.legal().length) return p.inCheck() ? { winner: p.turn() ^ 1, reason: 'mate' } : { winner: -1, reason: 'stalemate' };
    if (p.insufficient()) return { winner: -1, reason: 'material' };
    if (p.half() >= 100) return { winner: -1, reason: 'fifty' };
    const key = p.key();
    if (g.keys.filter(k => k === key).length >= 3) return { winner: -1, reason: 'repetition' };
    return null;
  },

  record(g, rec) {
    g.moves.push(rec);
    g.fens.push(g.pos.fen());
    g.keys.push(g.pos.key());
    const name = Book.openingAt(g.pos.key());
    if (name && !g.outOfBook) g.opening = name;
  },

  step(g) {
    const end = this.endState(g);
    if (end) return this.finish(g, end);
    if (g.pos.turn() !== g.me) return this.botTurn(g, null);
    g.thinking = false;
    const fen = g.pos.fen();
    g.preFen = fen;
    g.pre = Engine.analyse(fen, { multipv: 3 });
    g.pre.then(lines => {
      if (this.isCurrent(g) && g.preFen === fen && lines && lines.length) { this.setEval(g, lines[0].cp); this.paintEval(); }
    }, () => {});
    this.paint();
  },

  playerMove(m) {
    const g = this.current;
    this.tick(g);
    const pos = g.pos, from = Move.from(m), to = Move.to(m), keyBefore = pos.key(), uci = Chess.uci(m), prev = g.moves[g.moves.length - 1];
    const capturedValue = Move.flag(m) === Move.EN_PASSANT ? 100 : Chess.VAL[pos.get(to) & 7];
    const inBook = !g.outOfBook && Book.has(keyBefore, uci);
    if (!inBook) g.outOfBook = true;
    /* what the coach needs to rate the move, once the analyses are in */
    const facts = {
      uci, inBook, pre: g.pre,
      legalCount: pos.legal().length,
      pieceType: pos.get(from) & 7,
      recapture: !!(prev && prev.capture && prev.to === to),
      sacrifice: 0,
    };
    const rec = { san: pos.san(m), uci, from, to, by: 'me', capture: capturedValue > 0, cls: null, loss: null };
    playMove(pos, m);
    facts.sacrifice = Math.max(0, pos.see(to) - capturedValue);
    this.record(g, rec);
    clearSelection(g);
    g.promo = null;
    g.coach = { pending: true };
    g.running = pos.turn();
    g.tickAt = Date.now();

    const end = this.endState(g);
    if (!end) return this.botTurn(g, { rec, facts });
    /* the player's move ended the game: rate it against the final score */
    g.over = end;
    g.running = -1;
    this.paint();
    const final = end.winner === g.me ? 9990 : 0;
    Promise.resolve(facts.pre)
      .then(pre => { if (pre && pre.length) this.rate(g, rec, facts, pre, null, final); }, () => {})
      .then(() => this.finish(g, end));
  },

  rate(g, rec, facts, pre, after, final) {
    const r = rateMove(Object.assign({}, facts, { pre, after, final }));
    rec.cls = r.cls;
    rec.loss = r.loss;
    if (after && after.length) this.setEval(g, -after[0].cp);
    else if (final !== undefined && final !== null) this.setEval(g, final);
    g.coach = { rec };
  },

  /* pending: the player's last move, still to be rated with this analysis */
  async botTurn(g, pending) {
    g.thinking = true;
    this.paint();
    const fen = g.pos.fen(), startedAt = Date.now();
    let lines = null;
    try { lines = await Engine.analyse(fen, { multipv: 5 }); } catch (e) { /* bot plays without analysis */ }
    if (!this.isCurrent(g)) return;
    if (pending) {
      let pre = null;
      try { pre = await pending.facts.pre; } catch (e) {}
      if (!this.isCurrent(g)) return;
      if (pre && pre.length && lines && lines.length) this.rate(g, pending.rec, pending.facts, pre, lines, null);
      else g.coach = null;
      this.paint();
    }

    const pos = g.pos, key = pos.key();
    let uci = !g.outOfBook && Math.random() < 0.92 ? Book.randomMove(key) : null;
    const fromBook = !!uci;
    if (!uci) { uci = botMove(lines, g.botElo, pos); g.outOfBook = true; }

    /* human-like thinking time, short when the bot is low on time */
    let think = g.moves.length < 10 ? 500 + Math.random() * 900 : 900 + Math.random() * 2400;
    if (g.clock[g.me ^ 1] < 60000) think = 300;
    await sleep(Math.max(0, think - (Date.now() - startedAt)));
    if (!this.isCurrent(g)) return;

    this.tick(g);
    const m = pos.fromUci(uci) || pos.legal()[0], to = Move.to(m);
    const rec = { san: pos.san(m), uci: Chess.uci(m), from: Move.from(m), to, by: 'bot', cls: null };
    if (lines) {
      const line = lines.find(x => x.uci === rec.uci);
      if (line) this.setEval(g, -line.cp);
    }
    rec.capture = playMove(pos, m);
    this.record(g, rec);
    if (!fromBook) g.outOfBook = true;
    g.running = pos.turn();
    g.tickAt = Date.now();
    g.thinking = false;
    this.step(g);
  },

  finish(g, end) {
    if (g.done) return;
    Object.assign(g, { done: true, over: end, running: -1, thinking: false, promo: null });
    clearSelection(g);
    const result = end.winner === g.me ? 'w' : end.winner < 0 ? 'd' : 'l';
    const rated = g.moves.filter(x => x.by === 'me' && x.cls);
    g.counts = {};
    let total = 0, n = 0;
    for (const x of rated) {
      g.counts[x.cls] = (g.counts[x.cls] || 0) + 1;
      if (x.loss !== null && x.cls !== 'book' && x.cls !== 'forced') { total += accuracy(x.loss); n++; }
    }
    g.accuracy = n ? Math.round(total / n) : null;
    g.result = result;
    g.delta = 0;

    const p = Store.profile;
    /* a casual game abandoned before any move is not recorded */
    if (g.moves.length >= 2 || g.mode === 'ranked') {
      if (g.mode === 'ranked') {
        g.delta = eloDelta(result === 'w' ? 1 : result === 'd' ? 0.5 : 0, p.games);
        p.elo = Math.max(100, p.elo + g.delta);
        p.best = Math.max(p.best, p.elo);
        p.games++;
        p.record[result]++;
      }
      Store.addGame({
        at: Date.now(), mode: g.mode, result, colour: g.me, elo: p.elo, delta: g.delta, opponent: g.botElo,
        moves: Math.ceil(g.moves.length / 2), accuracy: g.accuracy, reason: end.reason,
      });
    }
    if (this.current === g) {
      this.paint();
      setTimeout(() => Sound.play(result === 'w' ? 'win' : result === 'l' ? 'lose' : 'draw'), end.reason === 'mate' ? 650 : 60);
    }
  },

  /* ---- player actions ---- */
  square(sq) {
    const g = this.current;
    if (!g || g.over || g.view >= 0 || g.pos.turn() !== g.me || g.promo) return;
    const moves = pickMove(g, g.pos, sq, g.me);
    if (moves && moves.length > 1) g.promo = moves;
    else if (moves) return this.playerMove(moves[0]);
    this.paintBoard();
  },
  promote(m) {
    const g = this.current;
    if (!g || !g.promo) return;
    g.promo = null;
    if (m) this.playerMove(m);
    else this.paintBoard();
  },
  resign() {
    const g = this.current;
    if (!g || g.over) return;
    if (isArmed(g.resignArmedAt)) { this.tick(g); return this.finish(g, { winner: g.me ^ 1, reason: 'resign' }); }
    g.resignArmedAt = Date.now();
    this.paintActions();
    setTimeout(() => { if (this.isCurrent(g)) this.paintActions(); }, ARM_MS + 100);
  },
  canUndo(g) { return !g.over && g.mode !== 'ranked' && g.pos.turn() === g.me && g.moves.length >= 2; },
  undo() {
    const g = this.current;
    if (!g || !this.canUndo(g)) return;
    g.pos.unmake(); g.pos.unmake();
    g.moves.length -= 2; g.fens.length -= 2; g.keys.length -= 2;
    clearSelection(g);
    g.coach = null;
    g.view = -1;
    this.step(g);
  },
  review(ply) {
    const g = this.current;
    if (!g) return;
    g.view = ply === g.moves.length ? -1 : ply;
    clearSelection(g);
    this.paintBoard(); this.paintMoves(); this.paintActions();
  },
  quit() { this.current = null; App.render(); },
  again() { App.actions[this.current.kind](); },

  /* ---- screen ---- */
  html() {
    const g = this.current;
    if (!g) return this.lobbyHtml();
    return '<section class="game"><div class="left">' +
      '<div class="pbar" id="pTop"></div>' +
      '<div class="bwrap"><div class="evalbar' + (g.me ? ' flip' : '') + '" id="evalbar" aria-hidden="true"><i id="evFill"></i></div><div class="board" id="board"></div></div>' +
      '<div class="pbar" id="pBot"></div></div>' +
      '<div class="side"><div id="coach"></div><div class="moves" id="moves" aria-label="' + t('game.movesAria') + '"></div>' +
      '<div class="row" id="actions"></div><div id="resultBox"></div></div></section>';
  },

  paint() {
    if (App.view() !== 'play' || !this.current) return;
    if (!$('#coach')) return App.render();
    this.paintBars(); this.paintBoard(); this.paintEval(); this.paintCoach(); this.paintMoves(); this.paintActions(); this.paintResult();
  },

  paintBars() {
    const g = this.current, bot = g.me ^ 1;
    const name = Engine.kind === 'stockfish' ? 'Stockfish' : t('engine.short');
    $('#pTop').innerHTML = '<span class="who"><i class="' + (bot ? 'b' : 'w') + '"></i>' + esc(name) + ' · ' + g.botElo +
      (g.thinking && !g.over ? ' <span class="chip">' + t('game.thinking') + '</span>' : '') + '</span><span class="clock" id="ck' + bot + '"></span>';
    $('#pBot').innerHTML = '<span class="who"><i class="' + (g.me ? 'b' : 'w') + '"></i>' + t('game.you') + ' · ' + Store.profile.elo +
      ' <span class="chip">' + t(g.mode === 'ranked' ? 'game.ranked' : 'game.casual') + '</span></span><span class="clock" id="ck' + g.me + '"></span>';
    this.paintClocks();
  },

  paintClocks() {
    const g = this.current;
    if (!g) return;
    for (const c of [0, 1]) {
      const el = $('#ck' + c);
      if (!el) continue;
      el.textContent = formatClock(g.clock[c]);
      el.className = 'clock' + (g.running === c ? (g.clock[c] < LOW_TIME_MS ? ' low' : ' on') : '');
    }
  },

  paintBoard() {
    const g = this.current, el = $('#board');
    if (!el) return;
    const live = g.view < 0, ply = live ? g.moves.length : g.view;
    const pos = live ? g.pos : Chess.create(g.fens[ply]), last = ply > 0 ? g.moves[ply - 1] : null;
    /* the coach badge sits on the player's last rated move, unless the bot has since landed there */
    let badge = null;
    if (g.coachOn) {
      const mine = g.moves.slice(Math.max(0, ply - 2), ply).reverse().find(x => x.by === 'me');
      if (mine && mine.cls) badge = { sq: mine.to, cls: mine.cls };
      if (badge && last && last.by === 'bot' && last.to === badge.sq) badge = null;
    }
    drawBoard(el, {
      pos, flip: g.me === 1, last: last ? [last.from, last.to] : null, badge,
      sel: live ? g.sel : -1, targets: live ? g.targets : null, promo: live ? g.promo : null,
    });
  },

  paintEval() {
    const g = this.current, bar = $('#evalbar');
    if (!bar) return;
    bar.hidden = !g.coachOn;
    $('#evFill').style.height = (winChance(g.evalWhite) * 100).toFixed(1) + '%';
  },

  paintCoach() {
    const g = this.current, el = $('#coach');
    if (!el) return;
    const opening = g.opening ? ' · ' + esc(openingName(openingById(g.opening))) : '';
    const box = (cls, label, body) => '<div class="card coach' + cls + '"' + (cls.includes('c-') ? ' aria-live="polite"' : '') + '><span class="label">' + label + '</span>' + body + '</div>';
    if (!g.coachOn) {
      el.innerHTML = box(' soft', t(g.mode === 'ranked' ? 'coach.ranked' : 'coach.noCoach') + opening, '<p class="muted small">' + t('coach.noFeedback') + '</p>');
    } else if (g.coach && g.coach.rec && g.coach.rec.cls) {
      const r = g.coach.rec;
      el.innerHTML = box(' c-' + r.cls, t('coach.coach') + ' · ' + esc(localSan(r.san)),
        '<div class="ttl"><b>' + CLASSES[r.cls] + '</b>' + t('class.' + r.cls) + '<span class="chip">' + formatEval(g.evalWhite) + '</span></div>' +
        '<p>' + esc(t('comment.' + r.cls)) + '</p>');
    } else if (g.coach && g.coach.pending) {
      el.innerHTML = box('', t('coach.coach'), '<p class="muted">' + t('coach.analysing') + '</p>');
    } else {
      const state = g.over ? 'coach.over' : g.pos.turn() === g.me ? 'coach.yourTurn' : 'coach.engineThinks';
      el.innerHTML = box('', t('coach.coach') + opening, '<p class="muted">' + t(state) + '</p>');
    }
  },

  paintMoves() {
    const g = this.current, el = $('#moves');
    if (!el) return;
    const [, side, , , , fullmove] = g.fens[0].split(' ');
    const first = +fullmove || 1, blackStarts = side === 'b', shown = g.view < 0 ? g.moves.length : g.view;
    const showClass = g.coachOn || g.done;
    let h = '';
    g.moves.forEach((m, i) => {
      const ply = i + (blackStarts ? 1 : 0);
      if (ply % 2 === 0 || i === 0) h += '<span class="n">' + (first + Math.floor(ply / 2)) + (ply % 2 ? '…' : '.') + '</span>';
      const rated = m.cls && showClass;
      h += '<button data-act="review" data-ply="' + (i + 1) + '"' + (shown === i + 1 ? ' aria-current="true"' : '') +
        ' class="' + (rated && m.by === 'me' ? 'mine c-' + m.cls : '') + '"' + (rated ? ' title="' + t('class.' + m.cls) + '"' : '') + '>' +
        esc(localSan(m.san)) + '</button>';
    });
    el.innerHTML = h || '<span class="muted small">' + t('game.movesEmpty') + '</span>';
    if (g.view < 0) el.scrollTop = el.scrollHeight;
  },

  paintActions() {
    const g = this.current, el = $('#actions');
    if (!el) return;
    let h = '';
    if (g.view >= 0) h += button('live', t('game.live'), 'sm primary');
    if (!g.over) {
      if (g.mode !== 'ranked') h += button('undo', t('game.undo'), 'sm', this.canUndo(g) ? '' : ' disabled');
      h += button('resign', t(isArmed(g.resignArmedAt) ? 'game.resignConfirm' : 'game.resign'), 'sm ko');
    }
    el.innerHTML = h;
  },

  paintResult() {
    const g = this.current, el = $('#resultBox');
    if (!el) return;
    if (!g.done) { el.innerHTML = ''; return; }
    let h = '<div class="card glow result"><span class="label">' + esc(t('reason.' + g.over.reason)) + '</span>' +
      '<h2>' + t(RESULT_KEYS[g.result]) + '</h2>';
    if (g.mode === 'ranked') h += '<div class="row"><span class="delta ' + (g.delta > 0 ? 'up' : g.delta < 0 ? 'down' : '') + '">' + formatDelta(g.delta) + '</span>' +
      '<span>' + t('result.newElo', { elo: Store.profile.elo }) + '</span></div>';
    if (g.accuracy !== null) h += '<p>' + t('result.accuracy', { n: g.accuracy }) + '</p>';
    h += '<div class="tally">' + SUMMARY_CLASSES.map(c =>
      '<div class="c-' + c + '"><b>' + CLASSES[c] + '</b>' + t('class.' + c) + '<span class="k">' + (g.counts[c] || 0) + '</span></div>').join('') + '</div>';
    h += '<p class="muted small">' + t('result.review') + '</p>';
    h += '<div class="row">' + button('again', t('result.again'), 'primary') + button('lobby', t('result.back')) + '</div></div>';
    el.innerHTML = h;
  },

  /* ---- lobby ---- */
  defaultLevel() { return Math.round(Store.profile.elo / 50) * 50; },
  lobbyHtml() {
    const p = Store.profile, l = this.lobby, level = l.level || this.defaultLevel();
    const colours = [['white', 'lobby.white'], ['random', 'lobby.random'], ['black', 'lobby.black']];
    return '<div class="cols3">' +
      '<div class="card glow"><span class="label">' + t('lobby.rankedLabel') + '</span>' +
        '<div class="row between"><div class="elo">' + p.elo + '</div><div class="muted small right">' +
        t('lobby.wdl', p.record) + '<br>' + t('lobby.record', { n: p.best }) + '</div></div>' +

        button('coached', t('lobby.coachBtn'), 'wide') + '</div>' +

        '<input type="range" id="lvl" min="300" max="2500" step="50" value="' + level + '">' +
